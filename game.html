<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бабушкина Ёлка</title>
  <link rel="stylesheet" href="./src/sass/index.css">
  <link rel="icon" href="./src/icon/icon.png">
</head>
<body class="body">
  <header class="header">
    <div class="wrapper">
      <div class="header__nav">
        <div class="header__icon">Главная</div>
        <ul class="header__navigation" id="header__navigation">
          <li class="header__link  header__link_active">Игрушки</li>
          <li class="header__link">Ёлка</li>
        </ul>
      </div>
    </div>
  </header>
  <main class="game-main">

    <section class="toys toys__main__active ">
      <div class="wrapper">
        <div class="toys__main">
          <div class="toys__filters">
            <input type="search" class="toys__search" autocomplete="off" placeholder="search">

            <div class="toys__forms">
              <span class="toys__title">Форма:</span>
              <div class="toys__balls">
                <button class="toys__ball toys__ball_first"></button>
                <button class="toys__ball toys__ball_second"></button>
                <button class="toys__ball toys__ball_third"></button>
                <button class="toys__ball toys__ball_fourth"></button>
                <button class="toys__ball toys__ball_fifth"></button>
              </div>
            </div>

            <div class="toys__colors">
              <span class="toys__title">Цвет:</span>
              <div class="toys__colors_count">
                <button class="toys__color"></button>
                <button class="toys__color"></button>
                <button class="toys__color"></button>
                <button class="toys__color"></button>
                <button class="toys__color"></button>
              </div>
            </div>

            <div class="toys__dimensions">
              <span class="toys__title">Размер:</span>
              <div class="toys__dimensions_count">
                <button class="toys__size toys__size_big"></button>
                <button class="toys__size toys__size_average"></button>
                <button class="toys__size toys__size_small"></button>
              </div>
            </div>

            <div class="toys__years">
              <span class="toys__title">Год приобретения:</span>
              <div class="toys__years_count">
                <button class="toys__year">1940</button>
                <button class="toys__year">1950</button>
                <button class="toys__year">1960</button>
                <button class="toys__year">1970</button>
                <button class="toys__year">1980</button>
                <button class="toys__year">1990</button>
                <button class="toys__year">2000</button>
                <button class="toys__year">2010</button>
                <button class="toys__year">2020</button>
              </div>
            </div>

            <div class="toys__count">
              <span class="toys__title">Количество экземпляров:</span>
              <div class="toys__count_range range">
                <input type="range" name="count" min="1" max="12" value="0" class="toys__range" id="toys__range">
                <output class="toys__count_show" role="status" id="toys__count_show">0</output>
              </div>
            </div>

            <form class="toys__select-form">
              <label for="toys__sort" class="toys__title">Сортировка:</label>
              <select class="toys__sort" id="toys__sort">
                <option class="toys__select-sort" selected value="toys__select-sort-name-max">По названию от «А» до «Я»</option>
                <option class="toys__select-sort" value="toys__select-sort-name-min">По названию от «Я» до «А»</option>
                <option class="toys__select-sort" value="toys__select-sort-count-max">По количеству по возрастанию</option>
                <option class="toys__select-sort" value="toys__select-sort-count-min">По количеству по убыванию</option>
              </select>
            </form>

            <div class="reset">
              <button class="reset__btn">Сброс фильтров</button>
            </div>

            <img src="./src/img/balls/60.png" alt="">

          </div>
        </div>
      </div>
    </section>

    <section class="christmas-tree">
      <div class="wrapper">
        <div class="christmas-tree__main">
         Ёлка
        </div>
      </div>
    </section>

  </main>
 <script src="./src/dist/btns.js"></script>
 <script src="./src/dist/toys.js"></script>
</body>
</html>
